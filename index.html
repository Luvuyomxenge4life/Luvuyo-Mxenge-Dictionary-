<style>
  body{margin:0;font-family:Georgia,serif;background:#fdf6e3;color:#3a2a1a}
  header{padding:24px 16px;text-align:center;background:#fff8e7;border-bottom:3px double #8b6a43;position:sticky;top:0;z-index:10}
  h1{margin:0;font-size:1.8rem;letter-spacing:1px}
  .sub{margin:6px 0 0;opacity:.7;font-style:italic;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px;max-width:1400px;margin:auto}
  .card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(90,60,20,.15);border:1px solid #e8d9b8;cursor:pointer;position:relative}
  .card img{width:100%;display:block}
  .card::after{content:"LUVUYO MXENGE DICTIONARY";position:absolute;bottom:44px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:8px;letter-spacing:1.5px;padding:3px 6px;border-radius:3px}
  .meta{padding:10px 12px;background:#fffaf0;border-top:1px solid #f0e0c0;font-weight:bold;font-size:13px}
  #q{width:90%;max-width:400px;padding:10px 14px;border-radius:999px;border:1px solid #d7c39a;font-size:16px;margin-top:12px}
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center}
  #modal.open{display:flex}
  #modal img{max-width:95vw;max-height:90vh;border-radius:10px}
</style>
</head>

const grid=document.getElementById('grid');
const modal=document.getElementById('modal');
const modalImg=document.getElementById('modalImg');
function render(list){
  grid.innerHTML='';
  list.forEach(function(f){
    var d=document.createElement('div');
    d.className='card';
    d.innerHTML='<img src="'+f[1]+'" loading="lazy"><div class="meta">'+f[0]+'</div>';
    d.onclick=function(){modalImg.src=f[1];modal.classList.add('open');};
    grid.appendChild(d);
  });
}
function doFilter(){
  var q=document.getElementById('q').value.toLowerCase();
  render(files.filter(function(f){return f[0].toLowerCase().indexOf(q)>-1;}));
}
render(files);
